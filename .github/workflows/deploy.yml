name: Verify and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_smoke_failure:
        description: "Make the production smoke step fail on purpose (checks the automatic rollback, AC-PLAT-12)"
        type: boolean
        default: false

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Start Compose services
        run: docker compose up -d --wait
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix tests/acceptance
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: tests/acceptance
      - name: Verify (Chromium only, @slow tests skipped)
        run: ./scripts/verify.sh

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Remember the current release image
        id: previous
        run: |
          image="$(flyctl releases -a rentnerd-app --image --json | jq -r '[.[] | select(.Status == "complete")][0].ImageRef // empty')"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Previous release image: ${image:-none (first deploy)}"
      - name: Deploy
        run: flyctl deploy --remote-only -a rentnerd-app
      - name: Keep one web and one worker machine
        run: flyctl scale count web=1 worker=1 --yes -a rentnerd-app
      - name: Install dependencies for the smoke test
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: tests/acceptance
      - name: Production smoke test
        env:
          SMOKE_USER_EMAIL: ${{ secrets.SMOKE_USER_EMAIL }}
          SMOKE_USER_PASSWORD: ${{ secrets.SMOKE_USER_PASSWORD }}
          FORCE_SMOKE_FAILURE: ${{ inputs.force_smoke_failure }}
        run: |
          ./scripts/smoke-prod.sh
          if [ "$FORCE_SMOKE_FAILURE" = "true" ]; then
            echo "::error::Smoke failure forced by the workflow_dispatch input."
            exit 1
          fi
      - name: Redeploy the previous release
        if: ${{ failure() && steps.previous.outputs.image != '' }}
        run: flyctl deploy --image "${{ steps.previous.outputs.image }}" -a rentnerd-app
