# Local services for development and tests (SPEC.md §15.5). Not used in production.
x-minio-image: &minio-image pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: rentnerd
      POSTGRES_PASSWORD: rentnerd
      POSTGRES_DB: rentnerd
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentnerd -d rentnerd_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: *minio-image
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Creates the buckets, then stays up (idle) so `docker compose up --wait` treats it as healthy:
  # --wait fails on a container that exits, even with status 0.
  minio-init:
    image: *minio-image
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 minio minio12345 &&
        mc mb --ignore-existing local/rentnerd-test &&
        mc mb --ignore-existing local/rentnerd-dev &&
        touch /tmp/buckets-ready &&
        exec sleep infinity
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/buckets-ready"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  minio-data:
